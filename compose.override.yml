# 로컬 전용 설정. `docker compose ...`를 실행하면 compose.yml에 자동으로 병합된다.
# 배포(compose.yml + compose.prod.yml)에는 쓰이지 않는다.
# - 포트는 127.0.0.1에만 게시한다. 이미 쓰는 포트면 .env의 *_HOST_PORT로 바꾼다 (D-44)

services:
  mysql:
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"

  flyway:
    # 개발용 시드(반복 마이그레이션)는 로컬에서만 적용한다. 배포(compose.yml + compose.prod.yml)에는 없다 (D-48)
    environment:
      FLYWAY_LOCATIONS: filesystem:/flyway/sql,filesystem:/flyway/seed
    volumes:
      - ./infra/db/seed:/flyway/seed:ro

  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"

  main:
    build: ./main
    ports:
      - "127.0.0.1:${MAIN_HOST_PORT:-8080}:8080"

  batch:
    build: ./batch
    ports:
      - "127.0.0.1:${BATCH_HOST_PORT:-8082}:8082"

  match:
    build: ./match
    ports:
      - "127.0.0.1:${MATCH_HOST_PORT:-8084}:8084"

  elasticsearch:
    ports:
      - "127.0.0.1:${ES_HOST_PORT:-9200}:9200"

  seaweedfs:
    ports:
      # presigned URL로 브라우저·curl이 직접 업로드하는 포트. 바꾸면 STORAGE_PUBLIC_ENDPOINT도 같이 바꾼다
      - "127.0.0.1:${SEAWEEDFS_HOST_PORT:-8333}:8333"

  prometheus:
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
