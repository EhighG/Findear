plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.findear'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

// 테스트에서 스키마를 만드는 Flyway는 compose의 flyway 이미지(13.8.1)와 같은 버전으로 맞춘다 (Boot 관리 버전 11.7은 MySQL 8.4를 "미검증"으로 경고한다)
ext['flyway.version'] = '13.8.1'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// AWS SDK v2 (S3 presigned URL·HeadObject). Boot가 버전을 관리하지 않으므로 BOM으로 고정한다 (D-12, D-13)
	implementation platform('software.amazon.awssdk:bom:2.55.8')
	implementation 'software.amazon.awssdk:s3'

	//firebase 의존성
	implementation 'com.google.firebase:firebase-admin:9.11.0'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	//query parameter에 데이터 들어가는 로그를 명시하기 위한 라이브러리
	implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.12.1'

	// jwt
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5', 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	compileOnly 'org.projectlombok:lombok'
//	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	// queryDSL
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.1.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"
	// for advanced query in querydsl
	implementation 'com.blazebit:blaze-persistence-integration-querydsl-expressions-jakarta:1.6.20'

	// testing
	testImplementation 'org.mockito:mockito-core'
	testImplementation 'org.mockito:mockito-junit-jupiter'
	// 외부 API 계약 테스트용 mock HTTP 서버 (Boot BOM이 관리하지 않아 버전 명시)
	testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'

	// MainApplicationTests·통합 테스트: Testcontainers(MySQL·Redis)와 @ServiceConnection (Boot 3.5 공식 방식).
	// 스키마는 테스트에서만 Flyway로 infra/db/migration을 적용한다 (운영은 compose의 flyway 컨테이너, D-20)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.flywaydb:flyway-core'
	testImplementation 'org.flywaydb:flyway-mysql'
}

tasks.named('test') {
	useJUnitPlatform()
}
