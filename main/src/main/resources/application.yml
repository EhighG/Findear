# 공통 설정. 모든 값은 ${ENV:기본값} 형태이고, 비밀값(MYSQL_PASSWORD, JWT_SECRET)은 기본값이 없다.
# 프로필은 SPRING_PROFILES_ACTIVE로 고른다 (local / prod). 변수 전체 목록: docs/restoration/06-db-and-config.md §6
spring:
  application:
    name: main
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:findear}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:findear}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 100
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:} # 빈 값이면 인증 없음

server:
  port: 8080
  servlet:
    encoding:
      force-response: true
  tomcat:
    uri-encoding: UTF-8

# 관리 포트는 앱 포트와 분리하고 호스트에 게시하지 않는다 (D-21)
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

servers:
  batch-server:
    url: ${BATCH_SERVER_URL:http://localhost:8082}
  match-server:
    url: ${MATCH_SERVER_URL:http://localhost:8084}

# 외부 API 주소는 공식 주소를 기본값으로 두고 환경변수를 만들지 않는다 (테스트에서만 교체, D-38)
auth:
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/members/login}
    authorization-uri: https://nid.naver.com/oauth2.0/authorize
    token-request-uri: https://nid.naver.com/oauth2.0/token
    member-info-request-uri: https://openapi.naver.com/v1/nid/me

vworld:
  api-key: ${VWORLD_API_KEY:}
  base-url: https://api.vworld.kr

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5500} # 쉼표 구분

jwt-secret: ${JWT_SECRET} # Base64, 256bit 이상
jwt-duration: ${JWT_ACCESS_TTL_MS:7200000} # 기본 2시간
