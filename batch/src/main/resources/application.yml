# 공통 설정. 모든 값은 ${ENV:기본값} 형태이고, 비밀값(MYSQL_PASSWORD)은 기본값이 없다.
# 프로필은 SPRING_PROFILES_ACTIVE로 고른다 (local / prod). 변수 전체 목록: docs/restoration/06-db-and-config.md §6
spring:
  application:
    name: batch
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${MYSQL_DATABASE:findear}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:findear}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  # 로컬은 보안 off. 배포의 인증 설정은 배포 구성(R-62)에서 추가한다
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  batch:
    job:
      # 기동 시 잡 자동 실행을 끈다 (잡이 둘이라 켜 두면 기동이 실패한다). 잡은 스케줄러와 API로만 실행한다
      enabled: false
    jdbc:
      # Spring Batch 메타 테이블은 Flyway(V1)가 만든다
      initialize-schema: never

server:
  port: 8082
  servlet:
    encoding:
      force-response: true
  tomcat:
    uri-encoding: UTF-8

# 관리 포트는 앱 포트와 분리하고 호스트에 게시하지 않는다 (D-21)
management:
  server:
    port: 8083
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

servers:
  match-server:
    url: ${MATCH_SERVER_URL:http://localhost:8084}
    connect-timeout: 3s
    read-timeout: 30s

# 외부 API 주소는 공식 주소를 기본값으로 두고 환경변수를 만들지 않는다 (테스트에서만 교체, D-38)
lost112:
  service-key: ${LOST112_SERVICE_KEY:} # 공공데이터포털 Decoding 키(Encoding 키도 받음). 비어 있으면 수집하지 않는다
  base-url: https://apis.data.go.kr/1320000
  collect-days: ${LOST112_COLLECT_DAYS:30} # 오늘-N일 ~ 오늘 수집 (O-4)
  page-size: ${LOST112_PAGE_SIZE:1000} # 요청 한 번의 numOfRows (O-4)
  max-pages: 1000 # 서비스당 페이지 수 안전 상한 (닿으면 멈추고 WARN). 고정값
  connect-timeout: 5s
  read-timeout: 60s

batch:
  scheduling:
    enabled: ${BATCH_SCHEDULING_ENABLED:true} # false면 스케줄러가 돌지 않는다
  jobs:
    police:
      cron: ${POLICE_JOB_CRON:0 0 4 * * *}
    findear:
      cron: ${FINDEAR_JOB_CRON:0 0 */2 * * *}
