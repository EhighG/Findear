plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.findear'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

// 테스트에서 스키마를 만드는 Flyway는 compose의 flyway 이미지(13.8.1)와 같은 버전으로 맞춘다 (Boot 관리 버전 11.7은 MySQL 8.4를 "미검증"으로 경고한다)
ext['flyway.version'] = '13.8.1'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'com.mysql:mysql-connector-j'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	// match 호출 계약 테스트용 mock HTTP 서버 (Boot BOM이 관리하지 않아 버전 명시, main과 같은 버전)
	testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.0'

	// 통합 테스트: Testcontainers(MySQL·Elasticsearch)와 @ServiceConnection (Boot 3.5 공식 방식).
	// 스키마는 테스트에서만 Flyway로 infra/db/migration을 적용한다 (운영은 compose의 flyway 컨테이너, D-20)
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:mysql'
	testImplementation 'org.testcontainers:elasticsearch'
	testImplementation 'org.flywaydb:flyway-core'
	testImplementation 'org.flywaydb:flyway-mysql'
}

tasks.named('test') {
	useJUnitPlatform()
}
