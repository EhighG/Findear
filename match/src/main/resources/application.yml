spring:
  application:
    name: match
server:
  port: 8084
management:        # main과 같은 구성 (04 §6), 관리 포트는 호스트에 게시하지 않는다 (D-21)
  server:
    port: 8085
  endpoints.web.exposure.include: health,info,prometheus,metrics
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
match:
  mock:
    seed: ${MATCH_MOCK_SEED:42}
    latency-ms: ${MATCH_MOCK_LATENCY_MS:0}
    max-results: ${MATCH_MOCK_MAX_RESULTS:100}
