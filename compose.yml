# Findear 공통 서비스 정의 (로컬·배포 공통)
# - 로컬: compose.override.yml이 자동으로 병합된다 (127.0.0.1 포트 게시 등)
# - 배포: docker compose -f compose.yml -f compose.prod.yml ...
# 구성: docs/restoration/04-target-architecture.md / 환경변수: docs/restoration/06-db-and-config.md §6
# 메모리 제한 기본값은 최소 사양이다 (D-31). OOM이 나면 .env의 *_MEM_LIMIT을 04 §5의 "여유" 값으로 올린다.

services:
  mysql:
    image: mysql:8.4.11
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-findear}
      MYSQL_USER: ${MYSQL_USER:-findear}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env에 MYSQL_PASSWORD를 설정하세요}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env에 MYSQL_ROOT_PASSWORD를 설정하세요}
      # infra/mysql/initdb/의 exporter 계정 생성에 사용 (최초 초기화 때만)
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?.env에 MYSQL_EXPORTER_PASSWORD를 설정하세요}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP로 확인해야 초기화용 임시 서버(--skip-networking)가 아니라 실제 서버가 뜬 뒤에 healthy가 된다
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEM_LIMIT:-512m}

  # 스키마 마이그레이션 one-shot (D-20): infra/db/migration/의 SQL을 적용하고 종료한다.
  # main·batch는 depends_on: flyway (service_completed_successfully)로 이 작업이 끝난 뒤 뜬다.
  flyway:
    image: flyway/flyway:13.8.1
    command: ["migrate"]
    environment:
      # 이미지에 든 드라이버는 MariaDB Connector/J. MySQL 8.4 기본 인증(caching_sha2_password)을
      # SSL 없이 통과하려면 서버 공개키 조회가 필요하다 (compose 내부망에서만 사용)
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-findear}?allowPublicKeyRetrieval=true
      FLYWAY_USER: ${MYSQL_USER:-findear}
      FLYWAY_PASSWORD: ${MYSQL_PASSWORD:?.env에 MYSQL_PASSWORD를 설정하세요}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./infra/db/migration:/flyway/sql:ro
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:8.8.3
    # refresh token만 저장하므로 영속화하지 않는다 (D-25): RDB 스냅샷·AOF 모두 끔
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-64m}

  # main API 서버 (R-21). 외부 키(NAVER_*, VWORLD_API_KEY)가 비어 있어도 기동한다.
  # 관리 포트 8081(actuator)은 호스트에 게시하지 않는다 (D-21). 로컬은 compose.override.yml의 build가 이 이미지 이름으로 태그한다.
  main:
    image: ${IMAGE_REGISTRY:-ghcr.io/ehighg}/findear-main:${IMAGE_TAG:-latest}
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: mysql
      DB_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-findear}
      MYSQL_USER: ${MYSQL_USER:-findear}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env에 MYSQL_PASSWORD를 설정하세요}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET을 설정하세요}
      JWT_ACCESS_TTL_MS: ${JWT_ACCESS_TTL_MS:-7200000}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-http://localhost:8080/members/login}
      VWORLD_API_KEY: ${VWORLD_API_KEY:-}
      FCM_ENABLED: ${FCM_ENABLED:-false}
      FCM_CREDENTIALS_PATH: ${FCM_CREDENTIALS_PATH:-/run/secrets/firebase-adminsdk.json}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5500}
      BATCH_SERVER_URL: http://batch:8082
      MATCH_SERVER_URL: http://match:8084
      # 이미지 스토리지 (R-24). 서버는 내부 주소로, presigned URL은 브라우저가 접근할 주소로 서명한다 (06 §4). AWS면 두 엔드포인트를 비운다
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT-http://localhost:8333}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:8333/findear-images}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-findear-images}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
      STORAGE_PRESIGN_EXPIRE_SECONDS: ${STORAGE_PRESIGN_EXPIRE_SECONDS:-600}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      # Firebase 서비스계정 JSON은 ./secrets/firebase-adminsdk.json (git 제외). 파일 하나가 아니라 디렉토리를 마운트한다:
      # 파일이 없을 때 Docker가 같은 이름의 디렉토리를 만들어 버리는 것을 피한다. FCM_ENABLED=false면 폴더가 없어도 된다.
      # 컨테이너는 uid 10001(findear)로 실행되므로 파일을 그 사용자가 읽을 수 있어야 한다(예: chmod 644, Linux 배포 서버).
      - ./secrets:/run/secrets:ro
    depends_on:
      mysql:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${MAIN_MEM_LIMIT:-512m}

  # batch 서버 (R-30, 팀 batch 복원): Findear 매칭·Lost112 검색 API와 스케줄 잡. MySQL(스키마는 flyway)과 ES를 쓰고, match는 요청 때만 호출한다(기동 의존 없음).
  # 키(LOST112_SERVICE_KEY)가 비어 있어도 기동한다. 관리 포트 8083(actuator)은 호스트에 게시하지 않는다 (D-21).
  # 로컬은 compose.override.yml의 build가 이 이미지 이름으로 태그한다.
  batch:
    image: ${IMAGE_REGISTRY:-ghcr.io/ehighg}/findear-batch:${IMAGE_TAG:-latest}
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: mysql
      DB_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-findear}
      MYSQL_USER: ${MYSQL_USER:-findear}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?.env에 MYSQL_PASSWORD를 설정하세요}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      MATCH_SERVER_URL: http://match:8084
      LOST112_SERVICE_KEY: ${LOST112_SERVICE_KEY:-}
      LOST112_COLLECT_DAYS: ${LOST112_COLLECT_DAYS:-30}
      LOST112_PAGE_SIZE: ${LOST112_PAGE_SIZE:-1000}
      BATCH_SCHEDULING_ENABLED: ${BATCH_SCHEDULING_ENABLED:-true}
      POLICE_JOB_CRON: ${POLICE_JOB_CRON:-0 0 4 * * *}
      FINDEAR_JOB_CRON: ${FINDEAR_JOB_CRON:-0 0 */2 * * *}
    depends_on:
      mysql:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${BATCH_MEM_LIMIT:-512m}

  # match mock 서버 (R-40, P1, D-28): 팀 시절 Django(OpenAI·fastText) 대신 같은 API를 결정적 점수로 흉내 낸다.
  # 다른 서비스에 의존하지 않는다 (main은 match 없이도 기동). 관리 포트 8085(actuator)는 호스트에 게시하지 않는다 (D-21).
  # 로컬은 compose.override.yml의 build가 이 이미지 이름으로 태그한다.
  match:
    image: ${IMAGE_REGISTRY:-ghcr.io/ehighg}/findear-match:${IMAGE_TAG:-latest}
    environment:
      TZ: ${TZ:-Asia/Seoul}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      MATCH_MOCK_SEED: ${MATCH_MOCK_SEED:-42}
      MATCH_MOCK_LATENCY_MS: ${MATCH_MOCK_LATENCY_MS:-0}
      MATCH_MOCK_MAX_RESULTS: ${MATCH_MOCK_MAX_RESULTS:-100}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${MATCH_MEM_LIMIT:-256m}

  elasticsearch:
    image: elasticsearch:8.19.22
    environment:
      TZ: ${TZ:-Asia/Seoul}
      discovery.type: single-node
      # 로컬 기본값. 배포는 compose.prod.yml에서 보안을 켠다 (R-62)
      xpack.security.enabled: "false"
      # 개발 PC 디스크 여유가 적을 때 인덱스가 read-only로 바뀌는 것 방지
      cluster.routing.allocation.disk.threshold_enabled: "false"
      # 힙은 컨테이너 메모리 제한의 절반 이하로 고정 (D-31)
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${ES_MEM_LIMIT:-1g}

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # 자격증명 파일(s3.json)을 환경변수로 만든 뒤 이미지 entrypoint로 넘긴다 (infra/seaweedfs/entrypoint.sh)
    entrypoint: ["/bin/sh", "/etc/seaweedfs/entrypoint.sh"]
    # 이미지 entrypoint가 server 모드에 -dir=/data -volume.max=0 -master.volumeSizeLimitMB=1024를 붙인다
    command: ["server", "-s3", "-s3.config=/tmp/s3.json", "-metricsPort=9327"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      # SeaweedFS용 임의 자격증명 (06 §4). 비어 있으면 entrypoint.sh가 기동을 멈춘다
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - seaweedfs-data:/data
      - ./infra/seaweedfs:/etc/seaweedfs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${SEAWEEDFS_MEM_LIMIT:-128m}

  # 이미지 버킷 준비 one-shot (R-13): 버킷 생성 → CORS → images/* 공개 읽기 정책. 다시 실행해도 결과가 같다.
  # AWS에서 쓸 aws-cli 명령과 같은 명령을 쓴다 (infra/seaweedfs/storage-init.sh)
  storage-init:
    image: amazon/aws-cli:2.37.5
    entrypoint: ["/bin/sh", "/etc/seaweedfs/storage-init.sh"]
    environment:
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_BUCKET: ${STORAGE_BUCKET:-findear-images}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5500}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - ./infra/seaweedfs:/etc/seaweedfs:ro
    depends_on:
      seaweedfs:
        condition: service_healthy

  # ---- 모니터링 (D-18). profile monitoring: .env의 COMPOSE_PROFILES=monitoring이면 같이 뜬다 ----

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${PROMETHEUS_MEM_LIMIT:-256m}

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?.env에 GRAFANA_ADMIN_PASSWORD를 설정하세요}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      # 데이터소스·대시보드는 파일로 관리한다 (provisioning)
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${GRAFANA_MEM_LIMIT:-192m}

  # 컨테이너별 CPU·메모리·네트워크 (이미지에 헬스체크가 들어 있다). 부하를 줄이는 옵션은 cAdvisor 문서의 일반적인 값
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    profiles: ["monitoring"]
    command: ["--docker_only=true", "--housekeeping_interval=30s"]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    deploy:
      resources:
        limits:
          memory: ${CADVISOR_MEM_LIMIT:-128m}

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    profiles: ["monitoring"]
    # exporter 계정은 infra/mysql/initdb/에서 만든다 (R-12)
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=exporter"]
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:?.env에 MYSQL_EXPORTER_PASSWORD를 설정하세요}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9104/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${EXPORTER_MEM_LIMIT:-32m}

  # 이미지에 셸·HTTP 도구가 없어(scratch) 헬스체크를 두지 않는다. 상태는 Prometheus의 up{job="redis"}로 본다
  redis-exporter:
    image: oliver006/redis_exporter:v1.92.1
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${EXPORTER_MEM_LIMIT:-32m}

  es-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.11.0
    profiles: ["monitoring"]
    command: ["--es.uri=http://elasticsearch:9200"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9114/"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${EXPORTER_MEM_LIMIT:-32m}

volumes:
  mysql-data:
  es-data:
  seaweedfs-data:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: findear
