# CI: push·PR마다 main·batch·match를 빌드(컴파일·테스트·bootJar)한다. 테스트만 하고 아무것도 올리지 않는다.
# 이미지 업로드는 images.yml 수동 실행으로만 한다 (D-58).
# main·batch 테스트는 Testcontainers(Docker)를 쓰며, ubuntu-latest 러너에는 Docker가 있다.
name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'front/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'front/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [main, batch, match]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # 캐시는 오픈소스(MIT) basic 공급자를 쓴다. 기본값 enhanced는 상용 구성요소라 이용약관 동의가 따른다 (D-59)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew build --init-script ../.github/ci/test-logging.gradle
