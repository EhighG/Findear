# 배포: SSH로 EC2에 접속해 서버의 infra/deploy/deploy.sh 를 실행한다. **수동 실행(workflow_dispatch)으로만** 동작한다.
# images.yml과 같은 이유다(D-58) — 배포는 사용자가 결정하는 일이라 push 때 자동으로 돌리지 않는다.
#
# 순서 (09 §1)
#   1) CI(ci.yml)가 통과한 master에서 Actions 탭의 "Images"를 실행해 GHCR에 이미지를 올린다.
#   2) 이 워크플로("Deploy")를 master에서 실행한다. 서버에서 git pull --ff-only → .env 검사 → pull → up --wait 가 돈다.
#      (서버의 deploy.sh가 git pull을 하므로 이 워크플로는 레포를 checkout하지 않는다)
#   롤백: image_tag에 이전 커밋 SHA(40자)를 넣어 다시 실행한다. 이미지만 돌아가고 compose 파일은 서버의 현재 것이다.
#         image_tag는 항상 deploy.sh --tag로 넘어가 서버 .env의 IMAGE_TAG보다 우선한다 — 기본값 latest로 실행하면 .env에 고정해 둔 SHA도 latest로 바뀐다.
#         구성까지 되돌리려면 서버에서 직접 `git checkout <SHA> && infra/deploy/deploy.sh --no-git --tag <SHA>` (deploy.sh 머리 주석).
#
# 필요한 시크릿. 이 파일에는 이름만 적는다. job이 environment "production"을 쓰므로 Repository secrets와 Environment secrets 모두 읽힌다.
#   권장: Settings > Environments > production 에서 Deployment branches를 master로 제한하고 시크릿을 Environment secrets로 둔다.
#   (아래 if의 master 한정은 실행되는 브랜치의 워크플로 파일 안에 있어, 쓰기 권한자가 다른 브랜치에서 지운 파일로 실행하면 우회된다.
#    Environment의 브랜치 제한은 GitHub 설정이라 우회되지 않는다. environment는 첫 실행 때 보호 규칙 없이 자동으로 만들어진다)
#   EC2_HOST         서버 주소 (IP 또는 DNS)
#   EC2_USER         SSH 사용자 (init-host.sh의 --user, docker 그룹 소속인 일반 사용자)
#   EC2_SSH_KEY      위 사용자의 SSH 개인키 전체 (-----BEGIN ... 줄부터 END 줄까지). 이 배포 전용 키를 새로 만들어 쓰는 것을 권한다.
#   EC2_KNOWN_HOSTS  서버의 호스트 키 줄 (known_hosts 형식, 예: "<EC2_HOST와 같은 주소> ssh-ed25519 AAAA...").
#                    실행 중에 ssh-keyscan을 하지 않는다 — 첫 접속에서 받은 키를 그냥 믿으면(TOFU) 중간자 공격을 막지 못한다.
#                    믿을 수 있는 곳(서버 안의 /etc/ssh/ssh_host_ed25519_key.pub, 또는 EC2 콘솔의 시스템 로그에 찍힌 호스트 키 지문과
#                    대조한 ssh-keyscan 결과)에서 미리 확인한 값을 넣는다. 주소 부분은 EC2_HOST 값과 같아야 한다.
#   만드는 예 (로컬에서):
#     gh secret set EC2_HOST --env production
#     gh secret set EC2_USER --env production
#     gh secret set EC2_SSH_KEY --env production < ~/.ssh/findear-deploy
#     gh secret set EC2_KNOWN_HOSTS --env production < known_hosts.txt
#
# 제약: GitHub Actions 러너의 IP는 고정이 아니다. 보안그룹 22를 관리자 IP만 열어 두면(09 §3) 이 워크플로는 서버에 접속하지 못한다.
#   선택지: (a) 배포할 때만 22를 일시적으로 열었다가 닫기, (b) 서버(또는 같은 VPC)에 self-hosted 러너를 두기,
#           (c) 이 워크플로를 쓰지 않고 서버에 접속해 직접 infra/deploy/deploy.sh 를 실행하기. 어느 쪽이든 배포를 결정할 때 고른다.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '배포할 이미지 태그: latest 또는 전체 커밋 SHA(40자 소문자 16진수). 롤백은 이전 SHA'
        type: string
        default: latest
      app_dir:
        description: '서버의 레포 경로 (절대 경로, init-host.sh 기본값 /opt/findear)'
        type: string
        default: /opt/findear

permissions:
  contents: read

# 배포가 겹치지 않게 대기시킨다 (실행 중인 배포를 취소하면 up이 중간에 끊긴다)
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # master가 아닌 브랜치에서 실행하면 건너뛴다
    if: github.ref == 'refs/heads/master'
    # 배포 시크릿·보호 규칙을 둘 Environment (머리 주석 참고)
    environment: production
    runs-on: ubuntu-latest
    # deploy.sh의 up --wait 최대 600초 + git pull·이미지 pull 여유
    timeout-minutes: 30
    steps:
      # 입력과 시크릿 값은 ${{ }}를 run 본문에 직접 쓰지 않고 env로 받아 셸 변수로만 쓴다 (스크립트 인젝션 방지,
      # https://docs.github.com/en/actions/reference/security/secure-use 의 "Use an intermediate environment variable")
      - name: Validate inputs and secrets
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          APP_DIR: ${{ inputs.app_dir }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          fail=0
          # images.yml이 올리는 태그와 같다: latest 또는 전체 커밋 SHA(40자, 소문자)
          if ! [[ "$IMAGE_TAG" =~ ^(latest|[0-9a-f]{40})$ ]]; then
            echo "::error::image_tag는 latest 또는 40자 소문자 16진수 커밋 SHA여야 합니다."
            fail=1
          fi
          # 절대 경로, 허용 문자만, '..' 경로 요소 금지
          if ! [[ "$APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]] || [[ "$APP_DIR" =~ (^|/)\.\.(/|$) ]]; then
            echo "::error::app_dir은 [A-Za-z0-9._/-]만 쓴 절대 경로여야 하고 '..'를 포함할 수 없습니다."
            fail=1
          fi
          # ssh 대상 형식: '-'로 시작하는 값이 ssh 옵션으로 해석되지 않게 허용 문자만 (사용자: 리눅스 사용자 이름, 주소: IP·DNS)
          if [ -n "$EC2_USER" ] && ! [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::EC2_USER는 리눅스 사용자 이름 형식([a-z_][a-z0-9_-]*)이어야 합니다."
            fail=1
          fi
          if [ -n "$EC2_HOST" ] && ! [[ "$EC2_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "::error::EC2_HOST는 IP 또는 DNS 이름([A-Za-z0-9.-], 영숫자로 시작)이어야 합니다."
            fail=1
          fi
          missing=""
          [ -n "$EC2_HOST" ] || missing="$missing EC2_HOST"
          [ -n "$EC2_USER" ] || missing="$missing EC2_USER"
          [ -n "$EC2_SSH_KEY" ] || missing="$missing EC2_SSH_KEY"
          [ -n "$EC2_KNOWN_HOSTS" ] || missing="$missing EC2_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::비어 있는 시크릿:$missing (Environment production 또는 Repository secrets에 만드세요, 이 파일 머리 주석 참고)"
            fail=1
          fi
          exit "$fail"

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          # printf로 끝에 줄바꿈을 보장한다 (시크릿 값은 끝 줄바꿈이 없을 수 있고, OpenSSH 개인키는 마지막 줄바꿈이 없으면 읽지 못한다)
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/deploy_known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/deploy_known_hosts

      # 원격 명령 문자열은 이 단계에서 만든다. ssh는 문자열을 서버 쪽 셸에 그대로 넘겨 다시 해석시키므로 값에 셸 특수문자가
      # 있으면 서버에서 명령이 실행된다. 그래서 (1) 앞 단계가 두 값을 허용 문자(영숫자와 . _ / -, 태그는 latest/SHA)로 이미 제한했고
      # (2) 여기서도 작은따옴표로 감싼다 — 허용 문자에 작은따옴표가 없으므로 따옴표가 깨질 수 없다. ssh의 종료 코드가 그대로
      # 단계(job) 결과가 된다 (원격 명령의 종료 코드를 ssh가 돌려준다. 접속 실패는 255).
      - name: Run deploy.sh on server
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          APP_DIR: ${{ inputs.app_dir }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          remote_cmd="cd '$APP_DIR' && ./infra/deploy/deploy.sh --tag '$IMAGE_TAG'"
          echo "원격 실행: $remote_cmd"
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/deploy_known_hosts" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            "$EC2_USER@$EC2_HOST" "$remote_cmd"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/deploy_known_hosts
